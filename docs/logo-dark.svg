<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="TokenSmith">
  <title>TokenSmith</title>
  <desc>TokenSmith logo (dark theme) — a cyan hexagonal token badge containing an amber lightning bolt, followed by the TokenSmith wordmark.</desc>
  <defs>
    <linearGradient id="ts-hex-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ts-bolt-d" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ts-shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagonal "token" badge -->
  <g filter="url(#ts-shadow-d)">
    <polygon points="104,60 82,98 38,98 16,60 38,22 82,22"
             fill="url(#ts-hex-d)"
             stroke="#155E75"
             stroke-width="1.5"
             stroke-linejoin="round"/>
    <polygon points="96,60 76,94 44,94 24,60 44,26 76,26"
             fill="none"
             stroke="rgba(255,255,255,0.4)"
             stroke-width="1"/>
  </g>

  <!-- Lightning bolt -->
  <path d="M 66 30 L 42 66 L 58 66 L 52 92 L 80 52 L 64 52 Z"
        fill="url(#ts-bolt-d)"
        stroke="#92400E"
        stroke-width="0.6"
        stroke-linejoin="round"/>

  <!-- Wordmark (light text for dark backgrounds) -->
  <text x="128" y="66"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46"
        font-weight="800"
        letter-spacing="-1.2"
        fill="#F1F5F9">Token<tspan fill="#22D3EE">Smith</tspan></text>

  <!-- Tagline -->
  <text x="130" y="94"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="12.5"
        font-weight="500"
        letter-spacing="0.6"
        fill="#94A3B8">save claude tokens · forge context</text>
</svg>
