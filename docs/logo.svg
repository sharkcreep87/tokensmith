<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="TokenSmith">
  <title>TokenSmith</title>
  <desc>TokenSmith logo — a cyan hexagonal token badge containing an amber lightning bolt, followed by the TokenSmith wordmark.</desc>
  <defs>
    <linearGradient id="ts-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ts-bolt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ts-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagonal "token" badge (flat-top, centered at 60,60, radius 44) -->
  <g filter="url(#ts-shadow)">
    <polygon points="104,60 82,98 38,98 16,60 38,22 82,22"
             fill="url(#ts-hex)"
             stroke="#0E7490"
             stroke-width="1.5"
             stroke-linejoin="round"/>
    <!-- inner rim highlight -->
    <polygon points="96,60 76,94 44,94 24,60 44,26 76,26"
             fill="none"
             stroke="rgba(255,255,255,0.35)"
             stroke-width="1"/>
  </g>

  <!-- Lightning bolt (tokens avoided) -->
  <path d="M 66 30 L 42 66 L 58 66 L 52 92 L 80 52 L 64 52 Z"
        fill="url(#ts-bolt)"
        stroke="#92400E"
        stroke-width="0.6"
        stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="128" y="66"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46"
        font-weight="800"
        letter-spacing="-1.2"
        fill="#0F172A">Token<tspan fill="#0891B2">Smith</tspan></text>

  <!-- Tagline -->
  <text x="130" y="94"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="12.5"
        font-weight="500"
        letter-spacing="0.6"
        fill="#64748B">save claude tokens · forge context</text>
</svg>
