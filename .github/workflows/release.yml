# Publish @sharkcreep/tokensmith to npm when a `v*` tag is pushed.
#
# Uses npm's trusted-publishing (OIDC) so:
#   - NO `NPM_TOKEN` secret is needed — the workflow exchanges a GitHub
#     OIDC token for a short-lived npm credential.
#   - Every tarball is stamped with a signed provenance statement linking
#     the npm release back to this commit, this workflow, and this runner.
#
# One-time setup on npmjs.com:
#   1. Sign in as the publishing account.
#   2. Go to https://www.npmjs.com/settings/~/packages and enable
#      "Trusted Publishing" for @sharkcreep/tokensmith.
#   3. Add this repository + `.github/workflows/release.yml` as the
#      trusted publisher source.
#
# Release flow:
#   npm version patch --message "Release v%s"
#   git push --follow-tags
#
# On the new `v*` tag this workflow:
#   1. Re-runs the full test matrix for safety.
#   2. Builds the dist/.
#   3. Publishes the package with provenance.
#   4. Creates a GitHub Release with auto-generated notes.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (pre-publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    # Required for npm OIDC trusted publishing.
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Verify tag matches package.json
        # Protect against a stale tag being pushed with the wrong version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
